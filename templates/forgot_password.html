{% extends "base.html" %}

{% block title %}Восстановление пароля — OCR Сервис{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">OCR Сервис</h1>
            <p class="text-primary-200 mt-2">Восстановление пароля</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            {% if success %}
            <div class="p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm mb-4">
                {{ success }}
            </div>
            <div class="text-center">
                <a href="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">← Вернуться к входу</a>
            </div>
            {% else %}
            {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="/forgot-password" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email аккаунта</label>
                    <input type="email" name="email" required autofocus
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
                </div>
                <button type="submit"
                    class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition duration-200">
                    Сбросить пароль
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="/login" class="text-sm text-slate-500 hover:text-primary-600 transition">← Назад</a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
