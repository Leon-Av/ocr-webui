{% extends "base.html" %}

{% block title %}Вход — OCR Сервис{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 3h7l4 4v14a1 1 0 01-1 1H9a1 1 0 01-1-1V4a1 1 0 011-1z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 3v5h5"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 12h6M11 15h6M11 18h4"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">OCR Сервис</h1>
            <p class="text-primary-200 mt-2">Распознавание текста на изображениях и PDF</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">Вход в аккаунт</h2>

            {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" name="email" required autofocus
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition">
                </div>
                <button type="submit"
                    class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition duration-200">
                    Войти
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="/forgot-password" class="text-sm text-slate-500 hover:text-primary-600 transition">Забыли пароль?</a>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="/admin/login" class="text-sm text-primary-200 hover:text-white transition">Вход для администратора →</a>
        </div>
    </div>
</div>
{% endblock %}
